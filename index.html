<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="高画質化">
  <title>写真の高画質化（プリント用）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <label class="btn primary">
      写真を選ぶ
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <div class="group" role="group" aria-label="サイズ">
      <select id="size" aria-label="書き出すサイズ">
        <option value="2L" selected>2L判（127×178mm）</option>
        <option value="L">L判（89×127mm）</option>
        <option value="hagaki">はがき（100×148mm）</option>
      </select>
      <button id="orient" class="btn" type="button" aria-pressed="false">縦向き</button>
      <button id="reset" class="btn" type="button" disabled>全身に戻す</button>
    </div>
    <button id="export" class="btn primary" type="button" disabled>保存</button>
  </header>

  <main id="stage">
    <canvas id="view" aria-label="切り抜きの表示"></canvas>
    <p id="empty">「写真を選ぶ」から画像を選んでください。<br>指でずらす・2本指で拡大縮小できます。</p>
  </main>

  <footer>
    <span id="info"></span>
    <label class="check"><input id="guide" type="checkbox" checked> 端が切れる目安の線</label>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
