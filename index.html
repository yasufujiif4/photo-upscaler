<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="高画質化">
  <title>写真の高画質化（プリント用）</title>
  <!-- CPU（WASM）で複数のコアを使うため、ページを cross-origin isolated にする（GitHub Pages ではヘッダーを付けられないので Service Worker で付ける） -->
  <script src="coi-serviceworker.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <label class="btn primary">
      写真を選ぶ
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <div class="group" role="group" aria-label="サイズ">
      <select id="size" aria-label="書き出すサイズ">
        <option value="2L" selected>2L判（127×178mm）</option>
        <option value="L">L判（89×127mm）</option>
        <option value="hagaki">はがき（100×148mm）</option>
      </select>
      <button id="orient" class="btn" type="button" aria-pressed="false">縦向き</button>
      <button id="reset" class="btn" type="button" disabled>全身に戻す</button>
    </div>
    <div class="group">
      <select id="shrink" aria-label="AIに渡す前の縮小">
        <option value="1">縮小しない</option>
        <option value="2">1/2に縮小</option>
        <option value="3" selected>1/3に縮小（おすすめ）</option>
        <option value="4">1/4に縮小</option>
      </select>
      <select id="engine" aria-label="AIの処理の方法">
        <option value="auto" selected>処理：自動</option>
        <option value="gpu">処理：GPU（速い）</option>
        <option value="cpu">処理：CPU（確実・遅い）</option>
      </select>
      <button id="enhance" class="btn accent" type="button" disabled>AIで高画質化</button>
      <button id="export" class="btn primary" type="button" disabled>保存</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="view" aria-label="切り抜きの表示"></canvas>
    <div id="busy" hidden><div class="panel"><p id="busyText">準備中…</p><progress id="busyBar" max="1" value="0"></progress><button id="cancel" class="btn" type="button">中止</button></div></div>
    <p id="empty">「写真を選ぶ」から画像を選んでください。<br>指でずらす・2本指で拡大縮小できます。</p>
  </main>

  <footer>
    <span><span id="status"></span><br><span id="info"></span></span>
    <span class="group">
      <label class="check"><input id="faceOn" type="checkbox" checked> 顔を補正</label>
      <label class="check slider">きれいさ
        <input id="fidelity" type="range" min="0" max="1" step="0.1" value="0.7" aria-label="顔補正の本人らしさ（0＝きれいさ優先、1＝本人らしさ優先）">
        本人らしさ <output id="fidelityValue">0.7</output></label>
      <label class="check"><input id="guide" type="checkbox" checked> 端が切れる目安の線</label>
    </span>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
